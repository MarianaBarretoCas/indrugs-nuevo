<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/menu_usuarios.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">

</head>

<body>
<header th:insert="~{Layouts/header_footerPaciente :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerPaciente :: error"></div>
    <div class="contenido">
            <div class="table-container">
                <div class="table-header">
                    <h1 class="section-title">Órdenes</h1>
                </div>
                <div class="table-responsive">
                    <table id="tabla1" class="table custom-table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre medicamento</th>
                            <th>Cantidad</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="medicamento, iterStat : ${orden.medicamentos}">
                            <td th:text="${iterStat.index + 1}"></td>
                            <td th:text="${medicamento.nombreMedicamento}"></td>
                            <td th:text="${medicamento.cantidad}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        <div class="text-center me-3">
            <a th:href="@{/paciente/3.pagina_de_ordenes}" style="text-decoration: none;">
                <button type="button" class="btn btnform">Volver</button>
            </a>
        </div>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerPaciente :: footer}"></footer>

<script>
    (() => {
      'use strict';
      const forms = document.querySelectorAll('.needs-validation');
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      });
    })();
</script>
</body>
</html>
