<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PQRS</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-form.css}" />
</head>
<body>
<header th:insert="~{Layouts/header_footerPaciente :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerPaciente :: error"></div>
    <div class="contenido">
        <div class="contenedor-form">
            <h1 class="titulo">Formulario de PQRS</h1>

            <form method="post" th:action="@{/paciente/guardar-pqrs}"
                  th:object="${pqrs}"
                  class="custom-form row mx-auto mt-3 g-3 needs-validation" novalidate>

                <input type="hidden" th:field="*{usuarioid}" th:value="${usuarioLogueado.idUsuario}" />

                <h5 class="solicitud">Todos los campos son obligatorios</h5>
                <h6 class="soli//citud">Elija un tipo de solicitud a continuación...</h6>
                <div class="col-12">
                    <label for="tipoPqrs" class="form-label">Tipo:</label>
                    <select id="tipoPqrs" th:field="*{tipoPqrs}" class="form-select" required>
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="Petición">Petición</option>
                        <option value="Queja">Queja</option>
                        <option value="Reclamo">Reclamo</option>
                        <option value="Sugerencia">Sugerencia</option>
                    </select>
                    <div class="valid-feedback">Correcto.</div>
                    <div class="invalid-feedback">Por favor seleccione un tipo.</div>
                </div>

                <div class="col-12">
                    <label for="motivo" class="form-label">Motivo:</label>
                    <textarea id="motivo" th:field="*{motivo}" class="form-control" rows="4" required></textarea>
                    <div class="valid-feedback">Correcto.</div>
                    <div class="invalid-feedback">Por favor ingrese su motivo.</div>
                </div>

                <div class="text-center col-12">
                    <button class="btn btnform" type="submit">Enviar PQRS</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerPaciente :: footer}"></footer>

<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
</body>
</html>
