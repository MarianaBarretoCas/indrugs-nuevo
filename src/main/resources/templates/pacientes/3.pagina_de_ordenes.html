<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Órdenes</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-form.css}">
</head>

<body>
<header th:insert="~{Layouts/header_footerPaciente :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerPaciente :: error"></div>
    <div class="contenido">
        <div th:if="${ordenes != null and !ordenes.isEmpty()}">
            <div class="table-container">
                <div class="table-header">
                    <h1 class="section-title">Gestión de Órdenes</h1>
                </div>
                <div class="table-responsive">
                    <table id="tabla1" class="table custom-table">
                        <thead>
                        <tr>
                            <th>Paciente</th>
                            <th>EPS</th>
                            <th>Fecha de entrega</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Detalle</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="orden : ${ordenes}">
                            <td th:text="${orden.pacienteNombre}"></td>
                            <td th:text="${orden.epsOrden}"></td>
                            <td th:text="${#temporals.format(orden.fechaEntrega, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${orden.direccionOrden}"></td>
                            <td th:text="${orden.telefonoOrden}"></td>
                            <td th:text="${orden.estadoOrden}"></td>
                            <td>
                                <a th:href="@{'/VerDetalle?idOrden=' + ${orden.idOrden}}" class="btn btnform">Detalle</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:if="${ordenes == null or #lists.isEmpty(ordenes)}" class="alert alert-info text-center">
            <div class="table-header">
                <h1 class="section-title">Gestión de Órdenes</h1>
            </div>
            <i class="fas fa-info-circle"></i> No hay órdenes activas.
        </div>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerPaciente :: footer}"></footer>
<script th:src="@{/JAVA_SCRIPT/carrito.js}"></script>
</body>
</html>
