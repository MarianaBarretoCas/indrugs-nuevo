<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Domicilio</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-form.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        #map { height: 400px; width: 100%; margin-top: 10px; }
        body { font-family: Arial, sans-serif; }
    </style>
</head>

<body>
<header th:insert="~{Layouts/header_footerPaciente :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerPaciente :: error"></div>

    <div class="contenido">

        <div class="contenedor-form">
            <h1 id="titulo_domicilio" class="text-center">Registrar Orden</h1>
            <form th:action="@{/paciente/guardar}" method="post" enctype="multipart/form-data"
                  id="formuno" class="custom-form row mt-3 g-3 needs-validation" novalidate th:object="${orden}" >

                <input type="hidden" th:value="${usuarioLogueado.idUsuario}" />
                <div class="InputsHidden" id="inputsHidden">


                </div>

                <div class="col-12">
                    <label for="eps">EPS:</label>
                    <input type="text" id="eps" th:field="*{epsOrden}" class="form-control" required />
                    <div class="valid-feedback">Correcto.</div>
                    <div class="invalid-feedback">Por favor escriba una eps.</div>
                    <div th:if="${#fields.hasErrors('epsOrden')}" class="text-danger">
                        <small th:errors="*{epsOrden}"></small>
                    </div>
                </div>

                <div class="col-12">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" th:field="*{direccionOrden}" class="form-control" required />
                    <div class="valid-feedback">Correcto.</div>
                    <div class="invalid-feedback">Por favor escriba su dirección.</div>
                    <div th:if="${#fields.hasErrors('direccionOrden')}" class="text-danger">
                        <small th:errors="*{direccionOrden}"></small>
                    </div>
                </div>

                <div class="col-12">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" th:field="*{telefonoOrden}" class="form-control" required />
                    <div class="valid-feedback">Correcto.</div>
                    <div class="invalid-feedback">Por favor escriba un teléfono.</div>
                    <div th:if="${#fields.hasErrors('telefonoOrden')}" class="text-danger">
                        <small th:errors="*{telefonoOrden}"></small>
                    </div>
                </div>

                <div class="col-12">
                    <label for="fecha">Fecha Entrega:</label>
                    <input type="datetime-local" id="fecha" th:field="*{fechaEntrega}" class="form-control" required />
                    <div class="valid-feedback">Correcto.</div>
                    <div class="invalid-feedback">Por favor seleccione una fecha.</div>
                    <div th:if="${#fields.hasErrors('fechaEntrega')}" class="text-danger">
                        <small th:errors="*{fechaEntrega}"></small>
                    </div>
                </div>

                <!--            <div class="col-12">-->
                <!--                <label for="formulaMedica">Fórmula Médica:</label>-->
                <!--                <input type="file" id="formulaMedica" name="formulaFile" accept=".pdf,.jpg,.jpeg,.png" required/>-->

                <!--&lt;!&ndash;                <input type="file" id="formulaMedica" th:field="*{formulaMedica}" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required />&ndash;&gt;-->
                <!--            </div>-->

                <div class="text-center col-12">
                    <button type="submit" id="enviar_solicitud" class="btn btn-primary">Enviar Solicitud</button>
                </div>
            </form>
        </div>




    </div>
</main>

<footer th:insert="~{Layouts/header_footerPaciente :: footer}"></footer>
<script th:src="@{/JAVA_SCRIPT/mapas.js}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('formuno');
      if (!form) return;


      let carritoError = document.getElementById('carrito-error');
      if (!carritoError) {
        carritoError = document.createElement('div');
        carritoError.id = 'carrito-error';
        carritoError.className = 'invalid-feedback d-block';
        const submitBtn = form.querySelector('[type="submit"]');
        if (submitBtn) submitBtn.parentNode.insertBefore(carritoError, submitBtn);
        else form.appendChild(carritoError);
      }

      form.addEventListener('submit', function (event) {

        form.querySelectorAll('.carrito-hidden').forEach(e => e.remove());
        carritoError.textContent = '';
        form.classList.remove('was-validated');


        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];

        carrito.forEach((item, index) => {
          const inputId = document.createElement('input');
          inputId.type = 'hidden';
          inputId.name = `medicamentos[${index}].idMedicamento`;
          inputId.value = item.idMedicamento;
          inputId.classList.add('carrito-hidden');
          form.appendChild(inputId);

          const inputCantidad = document.createElement('input');
          inputCantidad.type = 'hidden';
          inputCantidad.name = `medicamentos[${index}].cantidad`;
          inputCantidad.value = item.cantidad;
          inputCantidad.classList.add('carrito-hidden');
          form.appendChild(inputCantidad);
        });


        if (carrito.length === 0) {
          event.preventDefault();
          event.stopPropagation();
          carritoError.textContent = 'El carrito está vacío. Agrega al menos un medicamento.';
          form.classList.add('was-validated');
          // opcional: desplazar a la alerta
          carritoError.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }

        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
          form.classList.add('was-validated');
          const firstInvalid = form.querySelector(':invalid');
          if (firstInvalid) firstInvalid.focus();
          return;
        }


        const btn = form.querySelector('[type="submit"]');
        if (btn) btn.disabled = true;
      }, false);
});

</script>

<script th:src="@{/JAVA_SCRIPT/carrito.js}"></script>
</body>
</html>
