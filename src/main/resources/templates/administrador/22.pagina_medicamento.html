<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio administrador</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/menu_usuarios.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">
</head>

<body>
<header th:insert="~{Layouts/header_footerAdmin :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerAdmin :: error"></div>
    <div class="contenido">

        <div th:if="${medicamentos != null and !medicamentos.isEmpty()}">
            <div class="table-container">
                <div class="table-header">
                    <h1 class="section-title">MEDICAMENTOS</h1>
                </div>
                <div class="table-responsive">
                    <table id="tabla1" class="table tab1 custom-table text-center">
                        <thead>
                            <tr>
                                <th>MEDICAMENTO</th>
                                <th>DESCRIPCION</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="medicamento : ${medicamentos}">
                                <td th:text="${medicamento.nombreMedicamento}"></td>
                                <td th:text="${medicamento.descripcionMedicamento}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:if="${medicamentos == null or medicamentos.isEmpty()}">
            <p>No hay datos.</p>
        </div>

        <div class="text-center me-3">
            <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#formModal">Agregar medicamento</button>
        </div>
        <div th:insert="Layouts/form_pacientes :: form_medicamento"></div>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerAdmin :: footer}"></footer>
</body>
</html>
