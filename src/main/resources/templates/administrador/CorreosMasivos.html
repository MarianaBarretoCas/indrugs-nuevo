<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Correos</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/menu_usuarios.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-form.css}" />
</head>
<body>
<header th:insert="~{Layouts/header_footerAdmin :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerAdmin :: error"></div>
    <div class="contenido">
        <div class="contenedor-form">
            <h2 class="mb-3">Enviar correos</h2>
            <form th:action="@{/admin/enviar/masivo}" method="post" class="custom-form row mt-3 col-12 g-3 needs-validation" novalidate>

                <div class="mb-3">
                    <label>Asunto:</label>
                    <input type="text" class="form-control" name="asunto" required>
                    <div class="valid-feedback">BIEN.</div>
                    <div class="invalid-feedback">Por favor ingrese el asunto.</div>
                </div>

                <div class="mb-3">
                    <label>Mensaje:</label>
                    <textarea class="form-control" name="mensaje" rows="4" required></textarea>
                    <div class="valid-feedback">BIEN.</div>
                    <div class="invalid-feedback">Por favor ingrese un mensaje.</div>
                </div>

                <h4>Selecciona los destinatarios:</h4>
                <p><strong>Seleccionados:</strong> <span id="contador">0</span></p>
                <div class="table-responsive" style="max-height: 350px; overflow-y:auto;">
                    <table id="tabla1" class="table custom-table">
                        <thead>
                        <tr class="text-center">
                            <th>
                                <input type="checkbox" id="seleccionarTodos">
                                Todos
                            </th>
                            <th>Nombre</th>
                            <th>Correo</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${correos}">
                            <td>
                                <input type="checkbox" class="chk-dest" name="correos"
                                       th:value="${u.correo}">
                            </td>
                            <td th:text="${u.nombre}"></td>
                            <td th:text="${u.correo}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="text-center col-12 mt-3">
                    <button type="submit" class="btn btnform">Enviar correos</button>
                </div>

            </form>
        </div>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerAdmin :: footer}"></footer>
<script>
    const chkTodos = document.getElementById("seleccionarTodos");
    const chks = document.querySelectorAll(".chk-dest");
    const contador = document.getElementById("contador");

    function actualizarContador() {
        const seleccionados = document.querySelectorAll(".chk-dest:checked").length;
        contador.textContent = seleccionados;
    }

    // Cuando se marca "Seleccionar todos"
    chkTodos.addEventListener("change", function () {
        chks.forEach(chk => chk.checked = chkTodos.checked);
        actualizarContador();
    });

    // Cuando se marca un checkbox individual
    chks.forEach(chk => {
        chk.addEventListener("change", function () {
            // Si todos están marcados → marcar el checkbox de “todos”
            chkTodos.checked = [...chks].every(c => c.checked);
            actualizarContador();
        });
    });

    // Inicializar contador
    actualizarContador();
</script>
</body>
</html>
