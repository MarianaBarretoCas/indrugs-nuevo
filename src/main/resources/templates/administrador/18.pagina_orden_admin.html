<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Órdenes</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/menu_usuarios.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">
</head>

<body>
<header th:insert="~{Layouts/header_footerAdmin :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerAdmin :: error"></div>
    <div class="contenido">

        <div th:if="${ordenes != null and !ordenes.isEmpty()}">
            <div class="table-container">
                <div class="table-header">
                    <h1 class="section-title">Gestión de Órdenes</h1>
                    <div class="formularios">
                        <form method="get" th:action="@{/admin/18.pagina_orden_admin}" id="filtro" class="row mt-0 g-3 needs-validation">
                            <section class="filtrar-usuarios" >
                                <label for="estado">Estado:</label>
                                <select name="estadoOrden" id="estados" class="form-select">
                                    <option value="">Todos</option>
                                    <option value="ACTIVO" th:selected="${estadoSeleccionado == 'ACTIVO'}">Activo</option>
                                    <option value="INACTIVO" th:selected="${estadoSeleccionado == 'INACTIVO'}">Inactivo</option>
                                </select>

                                <button type="submit" class="btn btnfiltro">Filtrar</button>
                            </section>
                        </form>

                        <button type="button" onclick="descargarExcel()" class="btn btnfiltro">
                            <i class="fas fa-file-excel"></i> Exportar Excel
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table id="tabla1" class="table custom-table">
                        <thead>
                        <tr class="text-center">
                            <th>ID</th>
                            <th>Paciente</th>
                            <th>EPS</th>
                            <th>Fecha de entrega</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Detalle</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="orden : ${ordenes}" class="text-center">
                            <td th:text="${orden.idOrden}"></td>
                            <td th:text="${orden.pacienteNombre}"></td>
                            <td th:text="${orden.epsOrden}"></td>
                            <td th:text="${#temporals.format(orden.fechaEntrega, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${orden.direccionOrden}"></td>
                            <td th:text="${orden.telefonoOrden}"></td>
                            <td th:text="${orden.estadoOrden}"></td>
                            <td>
                                <a th:href="@{'/VerDetalle?idOrden=' + ${orden.idOrden}}" class="btn btnform">Detalle</a>
                            </td>
                            <td>
                                <a th:href="@{/admin/ordenes/eliminar/{idOrden}(idOrden=${orden.idOrden})}" class="btn btnborrar" onclick="return confirmarEliminacion()">Eliminar</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav class="mt-4" >
                    <ul class="pagination justify-content-center">

                        <li class="page-item" th:classappend="${ordenes.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/18.pagina_orden_admin(page=${ordenes.number - 1})}">
                                Anterior
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, ordenes.totalPages - 1)}"
                            th:classappend="${i == ordenes.number} ? 'active'">
                            <a class="page-link" th:text="${i + 1}"
                               th:href="@{/admin/18.pagina_orden_admin(page=${i})}">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${ordenes.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/18.pagina_orden_admin(page=${ordenes.number + 1})}">
                                Siguiente
                            </a>
                        </li>

                    </ul>
                </nav>
            </div>
        </div>

        <div th:if="${ordenes == null or ordenes.isEmpty()}" class="alert alert-info text-center">
            <div class="table-header">
                <h1 class="section-title">Gestión de Órdenes</h1>
                <div class="formularios">
                    <form method="get" th:action="@{/admin/18.pagina_orden_admin}" id="filtros" class="row mt-0 g-3 needs-validation">
                        <section class="filtrar-usuarios" >
                            <label for="estado">Estado:</label>
                            <select name="estadoOrden" id="estado" class="form-select">
                                <option value="">Todos</option>
                                <option value="ACTIVO" th:selected="${estadoSeleccionado == 'ACTIVO'}">Activo</option>
                                <option value="INACTIVO" th:selected="${estadoSeleccionado == 'INACTIVO'}">Inactivo</option>
                            </select>

                            <button type="submit" class="btn btnfiltro">Filtrar</button>
                        </section>
                    </form>

                </div>
            </div>
            <i class="fas fa-info-circle"></i> No hay órdenes registradas en el sistema.
        </div>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerAdmin :: footer}"></footer>

<script>
    function confirmarEliminacion() {
        return confirm("¿Estás seguro(a) de que deseas eliminar esta orden?");
    }
    function descargarExcel() {
        const estadoSelect = document.getElementById('estado');
        const estado = estadoSelect ? estadoSelect.value : '';

        let url = '/admin/ordenes/reporte/excel';
        if (estado && estado !== '') {
            url += '?estadoOrden=' + encodeURIComponent(estado);
        }

        window.location.href = url;
    }
</script>

</body>
</html>
