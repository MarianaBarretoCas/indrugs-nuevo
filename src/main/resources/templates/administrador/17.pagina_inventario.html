<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Indrugs</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/menu_usuarios.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">
</head>
<body>
<header th:insert="~{Layouts/header_footerAdmin :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerAdmin :: error"></div>
    <div class="contenido">
        <div th:if="${inventarios != null and !inventarios.isEmpty()}">
            <div class="table-container">
                <div class="table-header">
                    <h1 class="section-title">INVENTARIO</h1>
                    <div class="formularios">
                        <form method="get" th:action="@{/admin/17.pagina_inventario}" id="filtros" class="row mt-0 g-3 needs-validation">
                            <section class="filtrar-usuarios" >
                                <label for="estado">Estado:</label>
                                <select name="estadoMed" id="estado" class="form-select">
                                    <option value="">Todos</option>
                                    <option value="ACTIVO" th:selected="${estadoSeleccionado == 'ACTIVO'}">Activo</option>
                                    <option value="INACTIVO" th:selected="${estadoSeleccionado == 'INACTIVO'}">Inactivo</option>
                                </select>

                                <button type="submit" class="btn btnfiltro">Filtrar</button>
                            </section>
                        </form>
                        <div class="dropdown">
                            <button type="button" class="btn btnform dropdown-toggle" data-bs-toggle="dropdown">
                                Exportar
                            </button>
                            <div class="dropdown-menu rounded">
                                <a href="#" class="dropdown-item" onclick="document.getElementById('exportPdfForm').submit()"><i
                                        class="fas fa-file-pdf me-2"></i> Exportar PDF</a>
                                <a href="#" class="dropdown-item" onclick="document.getElementById('exportExcelForm').submit()"><i
                                        class="fas fa-file-excel me-2"></i> Exportar Excel</a>
                            </div>
                        </div>
                        <form id="exportPdfForm" th:action="@{/admin/export/inventario}" method="get" style="display: none;"></form>
                        <form id="exportExcelForm" th:action="@{/admin/export/inventario}" method="get" style="display: none;"></form>

                    </div>

                </div>
                <div class="table-responsive">
                    <table id="tabla1" class="table custom-table">
                        <thead>
                        <tr>
                            <th>Medicamento</th>
                            <th>Fecha Entrada</th>
                            <th>Stock</th>
                            <th>Vencimiento</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="inventario : ${inventarios}">
                            <td th:text="${inventario.nombreMedicamento}"></td>
                            <td th:text="${inventario.fechaEntrada}"></td>
                            <td th:text="${inventario.stock}"></td>
                            <td th:text="${inventario.vencimiento}"></td>
                            <td th:text="${inventario.estadoMed}"></td>
                            <td>
                                <button class="btn btnform"
                                        th:onclick="'abrirModalEdicionInventario(' + ${inventario.idInventario} + ')'">
                                    Editar
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div id="contenedorModalInv"></div>
                </div>
            </div>
        </div>

        <div th:if="${inventarios == null or inventarios.isEmpty()}">
            <div class="table-header">
                <h1 class="section-title">INVENTARIO</h1>
                <div class="formularios">
                    <form method="get" th:action="@{/admin/17.pagina_inventario}" id="filtros" class="row mt-0 g-3 needs-validation">
                        <section class="filtrar-usuarios" >
                            <label for="estado">Estado:</label>
                            <select name="estadoMed" id="estado" class="form-select">
                                <option value="">Todos</option>
                                <option value="ACTIVO" th:selected="${estadoSeleccionado == 'ACTIVO'}">Activo</option>
                                <option value="INACTIVO" th:selected="${estadoSeleccionado == 'INACTIVO'}">Inactivo</option>
                            </select>

                            <button type="submit" class="btn btnfiltro">Filtrar</button>
                        </section>
                    </form>
                </div>
            </div>
            <p>No hay datos.</p>
        </div>
        <div class="text-center me-3">
            <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#formModal">Agregar medicamento</button>
        </div>
        <div th:insert="~{Layouts/form_pacientes :: form_inventario}"></div>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerAdmin :: footer}"></footer>
<script th:src="@{/JAVA_SCRIPT/modalesEdicion.js}"></script>
</body>
</html>
