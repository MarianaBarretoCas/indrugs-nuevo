<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Domicilios</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link th:href="@{/css/1.estilos_pagina_inicio.css}" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-form.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        #map { height: 400px; width: 100%; margin-top: 10px; }
        body { font-family: Arial, sans-serif; }
    </style>
</head>
<body>
<header th:insert="~{Layouts/header_footerDomi :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerDomi :: error"></div>

    <div class="contenido">
        <div th:if="${domicilios != null and !domicilios.isEmpty()}">
            <div class="table-container">
                <div class="table-header">
                    <h1 class="section-title">Domicilios</h1>
                    <div class="formularios">
                        <form method="get" th:action="@{/domi/15.pagina_domicilio_domi}" id="filtros" class="row mt-0 g-3 needs-validation">
                            <section class="filtrar-usuarios" >
                                <label for="estado">Estado:</label>
                                <select name="estadoDomicilio" id="estado" class="form-select">
                                    <option value="">Todos</option>
                                    <option value="EN ESPERA" th:selected="${estadoSeleccionado == 'EN ESPERA'}">EN ESPERA</option>
                                    <option value="ENTREGADO" th:selected="${estadoSeleccionado == 'ENTREGADO'}">ENTREGADO</option>
                                </select>

                                <button type="submit" class="btn btnfiltro">Filtrar</button>
                            </section>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="tabla1" class="table custom-table">
                        <thead>
                        <tr class="text-center">
                            <th>ID</th>
                            <th>Ubicación</th>
                            <th>Fecha de Entrega</th>
                            <th>Vehículo</th>
                            <th>Orden</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                            <th>Ruta</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="domicilio : ${domicilios}" class="text-center">
                            <td th:text="${domicilio.idDomicilio}"></td>
                            <td th:text="${domicilio.ubicacionDomicilio}"></td>
                            <td th:text="${#temporals.format(domicilio.fechaEntregaDomicilio, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${domicilio.idVehiculo}"></td>
                            <td th:text="${domicilio.idOrden}"></td>
                            <td th:text="${domicilio.telefonoOrden}"></td>
                            <td th:text="${domicilio.estadoDomicilio}"></td>
                            <td>
                                <a th:href="@{/domi/actualizar/domicilio/{idDomicilio}(idDomicilio=${domicilio.idDomicilio})}" class="btn btnTabla1">Entregar</a>
                            </td>
                            <td>
                                <button class="btn btnTabla" data-bs-toggle="modal" data-bs-target="#formModal" th:attr="data-direccion=${domicilio.ubicacionDomicilio}">
                                    Ubicación
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content p-3">
                                <div class="modal-header">
                                    <h4 class="modal-title" id="formModalLabel">Mapa</h4>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                                </div>
                                <div id="loader" style="display:none; text-align:center; padding:10px; font-size:18px;">
                                     <p>Buscando ubicación...</p>
                                    <div class="loader"></div>
                                </div>
                                <div id="map"></div>
                                <div class="modal-footer justify-content-center">
                                    <button class="btn btnform text-center" id="mostrarInput" type="button">Abrir ruta</button>
                                    <div class="mt-3 col-6, text-center" id="direccionDomi" style="display:none;">
                                        <label for="direccionDomi">Dirección de inicio:</label>
                                        <input type="text" name="direccion" class="form-control" style="width: 100%" id="direccionDomic" required>
                                        <div class="valid-feedback">BIEN.</div>
                                        <div class="invalid-feedback">Por favor ingrese la dirección de inicio.</div>
                                        <input type="hidden" name="direccionfin" id="direccionPaciente">
                                        <button class="btn btnform" style="width: 100%" onclick="irMaps()" type="button">Ir</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <nav class="mt-4" >
                    <ul class="pagination justify-content-center">

                        <li class="page-item" th:classappend="${domicilios.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/domi/15.pagina_domicilio_domi(page=${domicilios.number - 1})}">
                                Anterior
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, domicilios.totalPages - 1)}"
                            th:classappend="${i == domicilios.number} ? 'active'">
                            <a class="page-link" th:text="${i + 1}"
                               th:href="@{/domi/15.pagina_domicilio_domi(page=${i})}">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${domicilios.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/domi/15.pagina_domicilio_domi(page=${domicilios.number + 1})}">
                                Siguiente
                            </a>
                        </li>

                    </ul>
                </nav>
            </div>
        </div>
        <div th:if="${domicilios == null or domicilios.isEmpty()}">
            <div class="formularios">
                <form method="get" th:action="@{/domi/15.pagina_domicilio_domi}" id="filtros" class="row mt-0 g-3 needs-validation">
                    <section class="filtrar-usuarios" >
                        <label for="estado">Estado:</label>
                        <select name="estadoDomicilio" id="estado" class="form-select">
                            <option value="">Todos</option>
                            <option value="EN ESPERA" th:selected="${estadoSeleccionado == 'EN ESPERA'}">EN ESPERA</option>
                            <option value="ENTREGADO" th:selected="${estadoSeleccionado == 'ENTREGADO'}">ENTREGADO</option>
                            <option value="EN CAMINO" th:selected="${estadoSeleccionado == 'EN CAMINO'}">EN CAMINO</option>
                        </select>

                        <button type="submit" class="btn btnfiltro">Filtrar</button>
                    </section>
                </form>
            </div>
            <div class="alert alert-info text-center"><i class="fas fa-info-circle"></i><p>No hay domicilios registrados.</p></div>
        </div>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerDomi :: footer}"></footer>
<script th:src="@{/JAVA_SCRIPT/mapas.js}"></script>
</body>
</html>
