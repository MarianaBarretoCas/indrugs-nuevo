<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Domicilios</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link th:href="@{/css/1.estilos_pagina_inicio.css}" rel="stylesheet" />
    <link th:href="@{/css/15.estilos_pagina_domiciliario.css}" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-form.css}">
</head>
<body>
<header th:insert="Layouts/header_footerDomi :: header"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerDomi :: error"></div>

    <div class="contenido">
        <div th:if="${domicilios != null and !domicilios.isEmpty()}">
            <div class="table-container">
                <div class="table-header">
                    <h2 class="section-title">Domicilios</h2>
                </div>

                <div class="table-responsive">
                    <table id="tabla1" class="table custom-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Ubicación</th>
                            <th>Fecha de Entrega</th>
                            <th>Vehículo</th>
                            <th>Orden</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="domicilio : ${domicilios}">
                            <td th:text="${domicilio.idDomicilio}"></td>
                            <td th:text="${domicilio.ubicacionDomicilio}"></td>
                            <td th:text="${#temporals.format(domicilio.fechaEntregaDomicilio, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${domicilio.idVehiculo}"></td>
                            <td th:text="${domicilio.idOrden}"></td>
                            <td th:text="${domicilio.telefonoOrden}"></td>
                            <td th:text="${domicilio.estadoDomicilio}"></td>
                            <td>
                                <a th:href="@{/actualizar/domicilio/{idDomicilio}(idDomicilio=${domicilio.idDomicilio})}" class="btn btnform">Entregar</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div th:if="${domicilios == null or domicilios.isEmpty()}">
            <p>No hay domicilios registrados.</p>
        </div>
    </div>
</main>

<footer th:insert="Layouts/header_footerDomi :: footer"></footer>
</body>
</html>
