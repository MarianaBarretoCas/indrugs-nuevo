<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indrugs</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link th:href="@{/css/1.estilos_pagina_inicio.css}" rel="stylesheet" />
    <link th:href="@{/css/12.estilos_pagina_vehiculos.css}" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-form.css}">
</head>
<body>
<header th:insert="~{Layouts/header_footerDomi :: header}"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerDomi :: error"></div>

    <div class="contenido">

        <div th:if="${vehiculos != null and !vehiculos.isEmpty()}">
            <div class="table-container">
                <div class="table-header">
                    <h2 class="section-title">Vehículos</h2>
                </div>

                <div class="table-responsive">
                    <table id="tabla1" class="table custom-table">
                        <thead>
                        <tr
                            <th>Propietario</th>
                            <th>Tipo</th>
                            <th>Placa</th>
                            <th>Color</th>
                            <th>Marca</th>
                            <th>Estados</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="vehiculo : ${vehiculos}">
                            <td th:text="${vehiculo.nombreUsuario}"></td>
                            <td th:text="${vehiculo.tipoVehiculo}"></td>
                            <td th:text="${vehiculo.placaVehiculo}"></td>
                            <td th:text="${vehiculo.colorVehiculo}"></td>
                            <td th:text="${vehiculo.marcaVehiculo}"></td>
                            <td th:text="${vehiculo.estadoVehiculo}"></td>

                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div th:if="${vehiculos == null or #lists.isEmpty(vehiculos)}">
            <p>No hay datos.</p>
        </div>
        <div class="text-center me-3">
            <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#formModal">
                Agregar vehículo
            </button>
        </div>
        <div th:insert="Layouts/form_pacientes :: form_vehiculo"></div>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerDomi :: footer}"></footer>
</body>
</html>
