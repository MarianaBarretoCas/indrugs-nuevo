<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Indrugs</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/1.estilos_pagina_inicio.css}" rel="stylesheet">
    <link th:href="@{/css/20.pagina_principal_admin.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/3.estilos_página_control.css}">
</head>

<body>
<header th:insert="~{Layouts/header_footerDomi :: header}"></header>

<main class="cuerpo_indrugs">
    <div class="contenido">
        <section class="dashboard">
            <div class="cards">
                <div class="card">
                    <a th:href="@{/domi/15.pagina_domicilio_domi}">
                        <div>
                            <span class="card_numeros" th:text="${totalDomiciliosActivos}">0</span>
                            <span class="card_nombre">Domicilios</span>
                        </div>
                        <div class="card_icono">
                            <img th:src="@{/Iconos/icons8-entrega-puerta-a-puerta-100.png}" alt="Domicilios">
                        </div>
                    </a>
                </div>
                <div class="card">
                    <a th:href="@{/domi/12.pagina_vehiculos}">
                        <div>
                            <span class="card_numeros" th:text="${totalVehiculos}" >0</span><br>
                            <span class="card_nombre">Vehículos</span>
                        </div>
                        <div class="card_icono">
                            <img th:src="@{/Iconos/icons8-vehículo-90.png}" alt="Vehículos">
                        </div>
                    </a>
                </div>
                <div class="card">
                    <a th:href="@{/domi/14.pagina_ordenes}">
                        <div>
                            <span class="card_numeros" th:text="${cantidadOrdenes}">0</span><br>
                            <span class="card_nombre">Órdenes</span>
                        </div>
                        <div class="card_icono">
                            <img th:src="@{/Iconos/icons8-clasificación-de-respuestas-80.png}" alt="Órdenes">
                        </div>
                    </a>
                </div>
            </div>

            <div class="contenido_dash">

                <div class="ordenes_recientes">
                    <div class="cabeza1">
                        <h2>Órdenes recientes</h2>
                        <a th:href="@{/domi/14.pagina_ordenes}">
                            <input class="botonD" type="button" value="VER TODO">
                        </a>
                    </div>
                    <div class="table-responsive" style="margin-top: auto;">
                        <table id="tabla1" class="table custom-table">
                            <thead>
                            <tr>
                                <th>Usurios</th>
                                <th>Fecha de orden</th>
                                <th>Estado de orden</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr class="table" id="cuerpo_tabla2" th:each="orden : ${ordenesRecientes}">
                                <td th:text="${orden.pacienteNombre}">Usuario</td>
                                <td th:text="${orden.fechaEntrega}">FechaEntregaOrden</td>
                                <td th:text="${orden.estadoOrden}">Estado</td>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="domicilio">
                    <div class="cabeza1">
                        <h2>Domicilios recientes</h2>
                        <a th:href="@{/domi/15.pagina_domicilio_domi}">
                            <input class="botonD" type="button" value="VER TODO">
                        </a>
                    </div>
                    <div th:if="${domiciliosRecientes.isEmpty()}">
                        <p>No tienes domicilios recientes.</p>
                    </div>
                    <div class="table-responsive" style="margin-top: auto;">
                        <table id="tabla1" class="table custom-table">
                            <thead>
                            <tr>
                                <th>Ubicación</th>
                                <th>Fecha de Entrega</th>
                                <th>Estado de Domicilio</th>
                            </tr>
                            </thead>
                            <tbody>
                                <tr class="table" id="cuerpo_tabla2" th:each="domicilio : ${domiciliosRecientes}">
                                    <td th:text="${domicilio.ubicacionDomicilio}">Ubicación</td>
                                    <td th:text="${domicilio.fechaEntregaDomicilio}">FechaEntregaDomicilio</td>
                                    <td th:text="${domicilio.estadoDomicilio}">Estado</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<footer th:insert="~{Layouts/header_footerDomi :: footer}"></footer>

<script th:src="@{/JAVA_SCRIPT/carrusel_domi.js}"></script>
</body>
</html>
